<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волейбольна Команда</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <div class="container">
        <header>
            <div class="logo" id="site-title">ВК LA VINA</div>
            <a href="/admin/" class="btn-admin">Увійти в CMS</a>
        </header>

        <!-- Блок Найближчий матч -->
        <section style="margin-top: 40px;">
            <h2>🔥 Найближча гра</h2>
            <div id="next-match-card" class="card" style="margin-top: 15px;">
                Завантаження матчу...
            </div>
        </section>

        <!-- Блок Склад команди -->
        <section style="margin-top: 40px;">
            <h2>🏐 Склад Команди</h2>
            <div class="grid" id="players-grid">
                <!-- Картки гравців завантажуються динамічно -->
            </div>
        </section>
    </div>

    <script src="js/main.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</body>
</html>
