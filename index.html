<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВК Лавина — Офіційний сайт волейбольного клубу</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Decap CMS Identity script видалено, оскільки використовуємо Sanity.io -->
</head>
<body>
    <header class="header">
        <div class="container header-container">
            <a href="#" class="logo">
                <span class="logo-accent">ВК</span> ЛАВИНА
            </a>
            <nav class="nav">
                <a href="#about">Про клуб</a>
                <a href="#team">Склад команди</a>
                <a href="#matches">Матчі</a>
                <a href="#contacts">Контакти</a>
            </nav>
            <!-- Оновлено посилання для входу в адмін-панель Sanity -->
            <a href="https://avohadro.sanity.studio" target="_blank" class="btn-admin">Увійти в CMS</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container hero-container">
                <h1>Волейбольний клуб <span class="highlight">«Лавина»</span></h1>
                <p>Сила, характер та жага до перемоги на кожному майданчику.</p>
                <a href="#matches" class="btn-primary">Найближчі матчі</a>
            </div>
        </section>

        <section id="team" class="team-section">
            <div class="container">
                <h2>Склад команди</h2>
                <div class="filters">
                    <button class="filter-btn active" data-role="all">Усі</button>
                    <button class="filter-btn" data-role="setter">Зв'язуючі</button>
                    <button class="filter-btn" data-role="spiker">Догравальники</button>
                    <button class="filter-btn" data-role="middle">Центральні</button>
                    <button class="filter-btn" data-role="opposite">Діагональні</button>
                    <button class="filter-btn" data-role="libero">Ліберо</button>
                </div>
                <div class="team-grid" id="team-grid">
                    <!-- Гравці завантажуються динамічно з Sanity API -->
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
