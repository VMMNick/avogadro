<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ВК Лавина — Офіційний сайт</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <div class="logo">🏐 ВК "ЛАВИНА"</div>
            <a href="/admin/" class="btn-admin">Увійти в CMS</a>
        </header>

        <div class="hero">
            <h1>Волейбольна Команда</h1>
            <p>Граємо серцем. Перемагаємо разом.</p>

            <div class="match-card">
                <div style="font-size:0.85rem; text-transform:uppercase; color:var(--accent); font-weight:800; letter-spacing:1px;">
                    🔥 Найближча гра • Чемпіонат Міста
                </div>
                <div class="teams-vs">
                    <div class="team-title">ВК "Лавина"</div>
                    <div class="vs-badge">VS</div>
                    <div class="team-title">ВК "Сокіл"</div>
                </div>
                <div style="color:var(--text-muted); font-size:0.95rem;">
                    📅 Субота, 28 Жовтня • 🕒 18:00 • 📍 СК "Олімпік"
                </div>
            </div>
        </div>

        <section style="margin-top: 40px;">
            <h2 style="text-align:center; font-size: 2rem;">Склад Команди</h2>

            <div class="filter-container">
                <button class="filter-btn active" data-filter="all">Усі</button>
                <button class="filter-btn" data-filter="setter">Зв'язуючі</button>
                <button class="filter-btn" data-filter="spiker">Догравальники</button>
                <button class="filter-btn" data-filter="middle">Центральні</button>
                <button class="filter-btn" data-filter="libero">Ліберо</button>
            </div>

            <div class="grid" id="players-grid">
                <!-- Картки генеруються за допомогою main.js -->
            </div>
        </section>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
