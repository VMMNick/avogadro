backend:
  name: github
  repo: https://github.com/VMMNick/avohadro
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: "players"
    label: "Гравці та Штаб"
    folder: "content/players"
    create: true
    slug: "{{number}}-{{fields.title}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "ПІБ / Ім'я", name: "title", widget: "string" }
      - { label: "Ігровий номер", name: "number", widget: "number" }
      - { 
          label: "Амплуа", 
          name: "role", 
          widget: "select", 
          options: [
            { label: "Зв'язуючий", value: "setter" },
            { label: "Догравальник", value: "spiker" },
            { label: "Центральний блокуючий", value: "middle" },
            { label: "Діагональний", value: "opposite" },
            { label: "Ліберо", value: "libero" }
          ] 
        }
      - { label: "Фото гравця", name: "image", widget: "image", required: false }

  - name: "matches"
    label: "Матчі та Результати"
    folder: "content/matches"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.opponent}}"
    extension: "json"
    format: "json"
    fields:
      - { label: "Назва суперника", name: "opponent", widget: "string" }
      - { label: "Дата та час гри", name: "date", widget: "datetime" }
      - { label: "Місце проведення / Зал", name: "location", widget: "string" }
      - { label: "Рахунок (якщо гра вже була, наприклад: 3:1)", name: "score", widget: "string", required: false }